<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>센플릭스 둘러보기</title><link rel="stylesheet" href="assets/fonts/pretendard-1.3.9/pretendardvariable-dynamic-subset.css"><style>
*{box-sizing:border-box}body{margin:0;background:#151618;font-family:'Pretendard Variable',sans-serif;color:#fff}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;transition:opacity .28s ease,filter .28s ease}body.docked iframe{height:calc(100% - 280px)}body.moving iframe{opacity:.35;filter:blur(3px)}#spot{position:fixed;border:1px solid #ffffffc0;border-radius:12px;box-shadow:0 0 0 9999px #000a;pointer-events:none;z-index:2;transition:all .38s cubic-bezier(.22,1,.36,1)}#coach{position:fixed;z-index:3;width:340px;max-width:calc(100vw - 32px);padding:19px 21px;border-radius:15px;background:#222426f5;border:1px solid #ffffff14;box-shadow:0 12px 40px #0003;transition:opacity .2s,transform .3s,left .38s,top .38s}body.moving #coach{opacity:0;transform:translateY(8px);pointer-events:none}h2{font-size:18px;letter-spacing:-.4px;margin:11px 0 8px}p{font-size:13px;line-height:1.7;color:#c7cbca;margin:0 0 15px}button,select,a{font:inherit}button{cursor:pointer;padding:8px 13px;border-radius:8px;border:1px solid #ffffff26;background:transparent;color:#eee;font-size:12px}button:disabled{opacity:.3}#next{background:#fff;color:#17191a;border-color:#fff}.nav{display:flex;gap:8px;align-items:center}.count{margin-right:auto;color:#999;font-size:11px}#steps{background:transparent;border:0;color:#abb5b0;font-size:11px;max-width:100%;padding:0}#steps option{background:#252728}#exit{position:fixed;z-index:4;right:16px;bottom:16px;background:#242628ed;color:#ddd;text-decoration:none;padding:9px 14px;border:1px solid #ffffff22;border-radius:30px;font-size:11px}#notice{font-size:12px;color:#a7d4bb;margin-bottom:12px}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#151618;z-index:5}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #a4cfb8;outline-offset:4px}[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body><iframe id="app" src="guide-frame.html" title="센플릭스 기능 체험 화면" sandbox="allow-scripts allow-same-origin"></iframe><div id="loading">센플릭스를 준비하고 있어요.</div><div id="spot" hidden></div><section id="coach" aria-label="기능 안내" hidden><select id="steps" aria-label="체험 항목"></select><h2 id="title"></h2><p id="desc"></p><div id="notice" role="status"></div><div class="nav"><span class="count"></span><button id="prev">이전</button><button id="next">다음 →</button></div></section><a id="exit" href="index.html">체험 종료 ↗</a><script>
(()=>{const $=s=>document.querySelector(s),frame=$('#app'),mobile=matchMedia('(max-width:700px)');let current=0,busy=false,target=null,seq=0;const all=[
['allvideos','#searchInput','영상 찾기','제목이나 초성을 입력하고 검색해 보세요. 실제 센플릭스와 같은 검색 기능입니다.'],
['external','#searchBar .sort-btns','영상 탭의 필터','최신순·오래된순을 바꿔보세요. 콘텐츠와 채널 필터도 실제 화면 그대로 사용할 수 있습니다.'],
['archive','#archiveMonthBar','기간별 보기','연도를 고른 다음 월을 선택하면 해당 시기에 올라온 영상을 모아볼 수 있습니다.'],
['bookmark','.bm-playlist-btn','즐겨찾기 · 재생목록','영상의 별 버튼으로 저장하거나 해제할 수 있어요. “재생목록으로 재생”은 모은 영상들을 이어보는 기능입니다. 체험용으로 3개를 담아두었습니다.'],
['series','.series-runtime','시리즈 재생시간','시리즈에 담긴 모든 영상의 재생시간을 합한 값입니다. 첫 영상 한 편의 길이가 아니에요.'],
['series','.series-share','시리즈 공유','이 버튼을 누르면 시리즈 영상들을 묶은 YouTube 재생목록 주소를 복사할 수 있습니다.'],
['schedule','#scheduleSources','스케줄 플랫폼 선택','전체·Mnet Plus·blip 중 보고 싶은 일정 출처를 선택해 보세요.'],
['schedule','#scheduleExportBtn','스케줄 내보내기','눌러서 한 달·기간·전체 중 선택해 보세요. 내보내기는 현재 일정을 한 번 저장하는 방식입니다. 체험에서는 파일을 저장하지 않습니다.'],
['schedule','#scheduleSubscribeBtn','스케줄 구독','구독할 플랫폼을 선택해 보세요. 등록 후에는 캘린더가 다시 읽을 때 변경 내용이 반영됩니다. 체험에서는 구독을 등록하지 않습니다.'],
['allvideos','[data-action="toggleTheme"]','다크 · 라이트 모드','버튼을 눌러 화면 밝기를 바꿔보세요. 체험 중 설정은 실제 페이지에 저장되지 않습니다.'],
['allvideos','[data-action="toggleSidebar"]','메뉴 최소화','메뉴 오른쪽 버튼을 누르면 메뉴가 접히고 영상 영역이 넓어집니다. 다시 눌러 펼칠 수 있어요.'],
['allvideos','.lang-btn','언어 변경','한국어·영어·일본어 버튼을 눌러보세요. 실제 센플릭스의 화면 문구가 바뀝니다.']];
let steps=all.filter(x=>!mobile.matches||x[2]!=='메뉴 최소화');const wait=ms=>new Promise(r=>setTimeout(r,ms));function visible(selector){return [...frame.contentDocument.querySelectorAll(selector)].find(e=>e.getBoundingClientRect().width&&e.getBoundingClientRect().height)}
function position(){if(!target||busy)return;const doc=frame.contentDocument;const dialog=visible('dialog[open]');const el=dialog||target;if(!el.isConnected)return;const r=el.getBoundingClientRect();let x=Math.max(8,r.left-5),y=Math.max(8,r.top-5),w=Math.min(innerWidth-x-8,r.width+10),h=Math.min(innerHeight-y-8,r.height+10);Object.assign($('#spot').style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});const coach=$('#coach'),cw=Math.min(340,innerWidth-32);coach.style.width=cw+'px';let top=y+h+14;if(top+coach.offsetHeight>innerHeight-58){top=innerHeight-coach.offsetHeight-58;if(!dialog&&r.top>100){frame.contentWindow.scrollBy({top:r.top-85,behavior:'smooth'})}}coach.style.left=Math.max(16,Math.min(innerWidth-cw-16,x))+'px';coach.style.top=Math.max(16,top)+'px'}
async function go(index){if(busy)return;busy=true;const token=++seq;document.body.classList.add('moving');await wait(matchMedia('(prefers-reduced-motion:reduce)').matches?0:200);current=index;const step=steps[current],api=frame.contentWindow.guideAPI;document.body.classList.toggle('docked',['다크 · 라이트 모드','언어 변경'].includes(step[2]));frame.contentDocument.querySelectorAll('dialog[open]').forEach(d=>d.close());api.closeDrawer();if(step[0]==='bookmark')api.prepareBookmarks();api.pick(step[0]);if(mobile.matches&&['다크 · 라이트 모드','언어 변경'].includes(step[2]))api.drawer();$('#title').textContent=step[2];$('#desc').textContent=step[3];$('#notice').textContent='';$('#steps').innerHTML=steps.map((s,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} · ${s[2]}</option>`).join('');$('#steps').value=current;$('.count').textContent=`${current+1} / ${steps.length}`;$('#prev').disabled=current===0;$('#next').textContent=current===steps.length-1?'마치기':'다음 →';await wait(180);target=visible(['다크 · 라이트 모드','언어 변경'].includes(step[2])?(mobile.matches?'#mobileDrawer ':'#sidebarBottom ')+step[1]:step[1]);if(!target)target=visible(step[0]==='external'?'#searchBar':'header');if(target){if(['다크 · 라이트 모드','언어 변경'].includes(step[2]))target.scrollIntoView({block:'end',behavior:'instant'});const r=target.getBoundingClientRect();if(r.top<70||r.bottom>innerHeight-300)frame.contentWindow.scrollBy({top:r.top-100,behavior:'instant'});}await wait(30);if(token!==seq)return;busy=false;$('#coach').hidden=false;$('#spot').hidden=false;position();document.body.classList.remove('moving')}
$('#next').onclick=()=>current===steps.length-1?location.assign('index.html'):go(current+1);$('#prev').onclick=()=>go(Math.max(0,current-1));$('#steps').onchange=e=>go(Number(e.target.value));addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.type==='guide-notice'){$('#notice').textContent=e.data.text;position()}});addEventListener('resize',()=>{const name=steps[current][2];steps=all.filter(x=>!mobile.matches||x[2]!=='메뉴 최소화');go(Math.max(0,steps.findIndex(s=>s[2]===name)))});setInterval(position,120);frame.addEventListener('load',async()=>{for(let i=0;i<100&&!frame.contentWindow.guideAPI;i++)await wait(100);if(!frame.contentWindow.guideAPI){$('#loading').textContent='화면을 불러오지 못했습니다. 새로고침해 주세요.';return}$('#loading').hidden=true;frame.contentWindow.addEventListener('scroll',position,{passive:true});new ResizeObserver(position).observe(frame.contentDocument.body);frame.contentDocument.addEventListener('click',()=>setTimeout(position,100));go(0)});
})();
</script></body></html>
