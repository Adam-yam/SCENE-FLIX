name: 스케줄 전체 백필 (1회용)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: crawlers/requirements.txt

      - name: 의존성 설치
        run: pip install -r crawlers/requirements.txt

      - name: 전체 스케줄 백필 실행
        run: python crawlers/backfill_schedule_once.py

      - name: 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedule
          git diff --cached --quiet && echo "변경사항 없음" && exit 0
          git commit -m "chore: 스케줄 전체 백필 $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
