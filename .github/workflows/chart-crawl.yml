name: ■ 각 음원 플랫폼 차트 크롤링

on:
  workflow_dispatch: {}

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests ytmusicapi pandas lxml

      - name: Run chart crawler
        run: python crawlers/crawl_chart.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/charts/chart.json
          git diff --staged --quiet || git commit -m "chore: update chart data [skip ci]"
          git push
