name: Validate site and crawlers
on:
  push:
    paths: ['index.html', 'assets/**', 'package.json', 'package-lock.json', 'service-worker.js', 'crawlers/**', 'tests/**', 'data/schedule/**', '.github/workflows/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r crawlers/requirements.txt
      - run: python -m unittest discover -s crawlers/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check service-worker.js
      - run: node tests/site.test.cjs
      - run: node tests/search.test.cjs
      - run: node tests/quality.test.cjs
