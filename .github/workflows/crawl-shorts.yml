name: ■ 공식채널/안원잘부 쇼츠 크롤링

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: crawlers/requirements.txt

      - name: 의존성 설치
        run: pip install -r crawlers/requirements.txt

      - name: Test crawlers
        run: python -m unittest discover -s crawlers/tests -q

      - name: Shorts 크롤링 실행
        run: python crawlers/crawl_shorts.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/shorts/shorts.json
          git diff --cached --quiet && echo "변경사항 없음" && exit 0
          git commit -m "chore: 공식채널/안원잘부 쇼츠 크롤링 크롤링 data 업데이트 $(date +'%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" || exit 1
            if git push; then exit 0; fi
          done
          exit 1
